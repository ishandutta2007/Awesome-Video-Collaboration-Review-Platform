<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="timeline-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes playheadScan {
      0% { transform: translateX(80px); }
      50% { transform: translateX(780px); }
      100% { transform: translateX(80px); }
    }
    @keyframes wavePulse {
      0%, 100% { height: 12px; y: 226px; }
      50% { height: 32px; y: 206px; }
    }
    @keyframes wavePulse2 {
      0%, 100% { height: 26px; y: 212px; }
      50% { height: 10px; y: 228px; }
    }
    @keyframes markerBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 180px 70px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 820px 200px;
    }
    .playhead-group {
      animation: playheadScan 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .wave-bar-1 { animation: wavePulse 1.6s ease-in-out infinite; }
    .wave-bar-2 { animation: wavePulse2 1.4s ease-in-out infinite; }
    .wave-bar-3 { animation: wavePulse 2.1s ease-in-out infinite; }
    .wave-bar-4 { animation: wavePulse2 1.8s ease-in-out infinite; }
    .rec-dot { animation: markerBlink 1.5s ease-in-out infinite; }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .text-mono {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="280" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Texture -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="120" y1="0" x2="120" y2="280" />
    <line x1="260" y1="0" x2="260" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="540" y1="0" x2="540" y2="280" />
    <line x1="680" y1="0" x2="680" y2="280" />
    <line x1="820" y1="0" x2="820" y2="280" />
    <line x1="940" y1="0" x2="940" y2="280" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs (Background layer) -->
  <circle class="orb-1" cx="180" cy="70" r="130" fill="#4f46e5" filter="url(#soft-glow)" />
  <circle class="orb-2" cx="840" cy="190" r="140" fill="#06b6d4" filter="url(#soft-glow)" />
  <circle cx="500" cy="140" r="160" fill="#7c3aed" opacity="0.12" filter="url(#soft-glow)" />

  <!-- Waveform Audio Tracks in lower background -->
  <g opacity="0.25">
    <rect class="wave-bar-1" x="840" y="215" width="4" height="20" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-2" x="848" y="220" width="4" height="15" rx="2" fill="#818cf8" />
    <rect class="wave-bar-3" x="856" y="210" width="4" height="25" rx="2" fill="#c084fc" />
    <rect class="wave-bar-4" x="864" y="222" width="4" height="13" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-1" x="872" y="214" width="4" height="21" rx="2" fill="#818cf8" />
    <rect class="wave-bar-3" x="880" y="208" width="4" height="27" rx="2" fill="#c084fc" />
    <rect class="wave-bar-2" x="888" y="218" width="4" height="17" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-4" x="896" y="223" width="4" height="12" rx="2" fill="#818cf8" />
    <rect class="wave-bar-1" x="904" y="212" width="4" height="23" rx="2" fill="#c084fc" />
  </g>

  <!-- Dynamic Timeline Bar (Bottom) -->
  <g transform="translate(60, 235)">
    <!-- Rail -->
    <rect x="0" y="0" width="880" height="8" rx="4" fill="#1e293b" />
    <rect x="0" y="0" width="880" height="8" rx="4" fill="url(#timeline-glow)" />

    <!-- Static Comment Markers on timeline -->
    <circle cx="160" cy="4" r="5" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="340" cy="4" r="5" fill="#10b981" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="520" cy="4" r="5" fill="#ec4899" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="700" cy="4" r="5" fill="#06b6d4" stroke="#0f172a" stroke-width="1.5" />

    <!-- Moving Playhead -->
    <g class="playhead-group">
      <line x1="0" y1="-14" x2="0" y2="18" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)" />
      <polygon points="-6,-14 6,-14 0,-4" fill="#38bdf8" />
    </g>
  </g>

  <!-- Status Badges Header Row -->
  <g transform="translate(60, 38)">
    <!-- Live Recording / Active Review Badge -->
    <rect x="0" y="0" width="132" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle class="rec-dot" cx="16" cy="13" r="5" fill="#ef4444" filter="url(#glow)" />
    <text x="30" y="17" fill="#f8fafc" class="text-mono" font-weight="600">LIVE REVIEW</text>

    <!-- Timecode Badge -->
    <rect x="144" y="0" width="128" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="156" y="17" fill="#38bdf8" class="text-mono">01:24:18:02</text>

    <!-- 4K UHD Badge -->
    <rect x="284" y="0" width="88" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="296" y="17" fill="#a78bfa" class="text-mono">4K • 60FPS</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (High contrast, clearly visible) -->
  <!-- Subtle dark backing box to guarantee contrast across all screens -->
  <rect x="52" y="76" width="896" height="136" rx="12" fill="#090d16" fill-opacity="0.65" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

  <!-- Main Title -->
  <text x="76" y="128" class="text-title" font-size="34" fill="url(#text-grad)" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.8))">
    Awesome Video Collaboration &amp; Review
  </text>

  <!-- Subtitle -->
  <text x="76" y="162" class="text-sub" font-size="15" fill="#cbd5e1">
    Curated Hub for SaaS Proofing Platforms &amp; Self-Hosted Open-Source Frame.io Alternatives
  </text>

  <!-- Tag Badges inside Foreground -->
  <g transform="translate(76, 178)">
    <rect x="0" y="0" width="138" height="20" rx="4" fill="#1e293b" />
    <text x="10" y="14" fill="#94a3b8" class="text-mono" font-size="10">⚡ FRAME-ACCURATE</text>

    <rect x="146" y="0" width="138" height="20" rx="4" fill="#1e293b" />
    <text x="156" y="14" fill="#94a3b8" class="text-mono" font-size="10">💬 TIMESTAMP NOTES</text>

    <rect x="292" y="0" width="144" height="20" rx="4" fill="#1e293b" />
    <text x="302" y="14" fill="#94a3b8" class="text-mono" font-size="10">🔒 SELF-HOSTED S3</text>

    <rect x="444" y="0" width="140" height="20" rx="4" fill="#1e293b" />
    <text x="454" y="14" fill="#94a3b8" class="text-mono" font-size="10">🎬 NLE ROUNDTRIP</text>
  </g>
</svg>
